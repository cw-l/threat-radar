name: Weekly Threat Radar CSV Generation

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push the CSV back to the repo
      actions: write   # lets this job start the deploy workflow
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai requests
          
      - name: Ensure data directory exists
        run: mkdir -p data
        
      - name: Generate Threat Intelligence CSV
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_threat_profile.py

      - name: Create dated copy and update file list
        run: |
          STAMP=$(date -u +%Y%b%d)              # e.g. 2026Oct14
          NEW="maritime-${STAMP}.csv"
          cp data/maritime_latest.csv "data/${NEW}"
          mkdir -p public/data
          [ -f public/data/files.json ] || echo '[]' > public/data/files.json
          jq --arg f "$NEW" 'if index($f) then . else [$f] + . end' \
            public/data/files.json > /tmp/files.json
          mv /tmp/files.json public/data/files.json
          echo "NEW=${NEW}" >> "$GITHUB_ENV"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add data/maritime_latest.csv "data/${NEW}" public/data/files.json
          git diff --staged --quiet || git commit -m "chore: weekly maritime threat radar update ${STAMP}"
          git pull --rebase
          git push

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
