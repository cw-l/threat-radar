name: Weekly Threat Radar CSV Generation

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push the CSV back to the repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests
          
      - name: Ensure data directory exists
        run: mkdir -p data
        
      - name: Generate Threat Intelligence CSV
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_threat_profile.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Commit and push updated CSV
        run: |
          git add data/maritime_latest.csv
          git diff --staged --quiet || git commit -m "chore: weekly maritime threat radar update"
          git push
